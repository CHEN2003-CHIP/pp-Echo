[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-agent"
version = "0.2.0"
description = "Personal coding agent for Windows 10 with Qwen via Alibaba Bailian."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<0.29",
  "prompt_toolkit>=3.0.43,<4",
  "pydantic>=2.7,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
pp-agent = "agent_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]