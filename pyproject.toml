[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-agent"
version = "0.1.0a1"
description = "A Windows-first coding agent CLI with plan-before-act, approval gates, session branching, and git-backed safe rewind."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<0.29",
  "prompt_toolkit>=3.0.43,<4",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "rank-bm25>=0.2.2,<0.3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "chromadb>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]
tui = [
  "textual>=0.61,<1",
]
web = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]
attachments = [
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
]

[project.scripts]
pp-agent = "pp_agent.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--assert=plain"]
