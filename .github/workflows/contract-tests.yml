name: Contract Tests

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run contract gate
        run: python -m pytest tests/contracts tests/integrations/test_cross_system_consistency.py tests/runtime/test_tool_policy_contract.py tests/observability/test_audit_graph.py -q
